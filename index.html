<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Casa">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Casa</title>
<style>
:root{
  --bg:#f5f6f4; --card:#fff; --ink:#1d2421; --muted:#6b7772; --line:#e3e7e4;
  --brand:#1f6f5c; --brand-ink:#fff; --warn:#c2410c; --danger:#b91c1c; --ok:#15803d;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121614; --card:#1b211f; --ink:#e8eeeb; --muted:#8c9a94; --line:#2a3330; --brand:#3aa78d; --brand-ink:#08120f; --warn:#fb923c; --danger:#f87171; --ok:#4ade80;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) 16px 10px}
header h1{font-size:20px;margin:0}
header small{color:var(--muted)}
main{flex:1;padding:4px 16px 96px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.item{display:flex;align-items:center;gap:10px;justify-content:space-between}
.item .grow{flex:1;min-width:0;cursor:pointer}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{color:var(--muted);font-size:14px}
.late{color:var(--danger)} .soon{color:var(--warn)} .ok{color:var(--ok)}
.empty{color:var(--muted);padding:6px 2px;font-size:14px}
.hint{color:var(--muted);font-size:13px;margin:2px 2px 0}
button{font:inherit;border:0;border-radius:10px;padding:9px 14px;cursor:pointer}
.primary{background:var(--brand);color:var(--brand-ink);font-weight:600}
.outline{background:transparent;color:var(--brand);border:1.5px solid var(--brand);font-weight:600}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.small{padding:6px 10px;font-size:14px}
.link{background:none;color:var(--muted);padding:4px 6px}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 76px);width:54px;height:54px;border-radius:50%;font-size:28px;line-height:1;padding:0;box-shadow:0 4px 14px rgba(0,0,0,.25)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--muted);padding:10px 2px 8px;font-size:12px;border-radius:0}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--brand);font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px)}
.sheet h3{margin:0 0 10px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
input,select{display:block;width:100%;margin-top:4px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.row .spacer{flex:1}
.center{padding:48px 20px}
.center h1{margin:0 0 6px}
.center p{color:var(--muted)}
.stack>*{margin-bottom:10px}
.weekbar{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.day{margin-bottom:8px}
.day .dn{font-weight:600;margin-bottom:4px}
.day .dn.today{color:var(--brand)}
.slot{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.slot b{width:56px;font-size:12px;text-transform:uppercase;color:var(--muted);font-weight:600}
.slot span.ph{color:var(--muted)}
.err{color:var(--danger);font-size:14px;min-height:20px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-of-type{border-top:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right;overflow-wrap:anywhere}
.brief{background:var(--brand);color:var(--brand-ink);border:0;margin-top:6px}
.brief .hi{font-size:20px;font-weight:700;margin:0}
.brief .dt{opacity:.85;font-size:14px;margin-bottom:8px}
.brief .dt::first-letter{text-transform:uppercase}
.brief .sum{font-size:15px;line-height:1.45}
.chip{display:inline-block;padding:0 8px;border-radius:99px;font-size:12px;border:1px solid var(--line);color:var(--muted);margin-left:6px}
.chip.me{border-color:var(--brand);color:var(--brand)}
.seg{display:flex;gap:6px;margin:8px 0 4px}
.seg button{flex:1;background:transparent;color:var(--muted);border:1px solid var(--line);padding:8px 4px;font-size:14px}
.seg button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
a.btn{display:inline-block;text-decoration:none;border-radius:10px;padding:6px 10px;font-size:14px;white-space:nowrap}
a.btn.primary{background:var(--brand);color:var(--brand-ink)}
.when{font-variant-numeric:tabular-nums;font-weight:700;margin-right:8px}
.sub{font-size:13px;color:var(--muted);margin:10px 2px 4px}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ============ CONFIGURAZIONE ============
// Supabase → Project Settings → API (URL del progetto + chiave pubblica "publishable"/"anon")
const SUPABASE_URL = 'https://dbdxilaxtspzxuyrxbra.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Bevfj67zK_NfGfJBb5GyNg_sjsMwn6k';
// ========================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');

const CATS = ['bollette','condominio','mutuo/affitto','assicurazioni','tasse','spesa','manutenzione','altro'];
const RECS = [['none','Una tantum'],['monthly','Ogni mese'],['bimonthly','Ogni 2 mesi'],['quarterly','Ogni 3 mesi'],['semiannual','Ogni 6 mesi'],['yearly','Ogni anno']];
const REC_N = {none:0, monthly:1, bimonthly:2, quarterly:3, semiannual:6, yearly:12};
const TABS = [['oggi','🏠','Oggi'],['spese','💶','Spese'],['faccende','🧹','Faccende'],['menu','🍝','Menu'],['impegni','📅','Impegni'],['casa','🔧','Casa']];

const state = { screen:'loading', user:null, member:null, house:null, tab:'oggi', casaView:'componenti', d:{}, weekStart:monday(new Date()), err:'' };

// ---------- utilità ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function monday(d){ d=new Date(d); d.setDate(d.getDate()-((d.getDay()+6)%7)); d.setHours(0,0,0,0); return d; }
function iso(d){ const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function toLocalInput(s){ const d=new Date(s); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function addMonths(s,n){
  const [y,m,d]=s.split('-').map(Number);
  const t=new Date(y,m-1+n,1), last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  t.setDate(Math.min(d,last)); return iso(t);
}
const today = () => iso(new Date());
const eur = n => n==null ? '' : new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n);
const fmtDay = s => new Date(s+'T00:00').toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'});
const fmtDT = s => new Date(s).toLocaleString('it-IT',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const nameOf = id => (state.d.members||[]).find(m=>m.user_id===id)?.display_name || '—';
function daysFromToday(s){ return Math.round((new Date(s+'T00:00') - new Date(today()+'T00:00'))/86400000); }
function dueLabel(s){
  const n=daysFromToday(s);
  if(n<0) return `<span class="late">scaduta da ${-n} g</span>`;
  if(n===0) return `<span class="soon">oggi</span>`;
  if(n===1) return `<span class="soon">domani</span>`;
  return `<span class="${n<=7?'soon':''}">${fmtDay(s)}</span>`;
}

// ---------- dati ----------
async function loadData(){
  const ws=iso(state.weekStart), we=iso(addDays(state.weekStart,6));
  const [m,e,c,ev,me,td,co,ma,ct,cs] = await Promise.all([
    sb.from('members').select('*'),
    sb.from('expenses').select('*').order('due_date'),
    sb.from('chores').select('*').order('next_due'),
    sb.from('events').select('*').gte('starts_at', new Date(Date.now()-864e5).toISOString()).order('starts_at'),
    sb.from('meals').select('*').gte('day',ws).lte('day',we),
    sb.from('meals').select('*').gte('day',today()).lte('day',iso(addDays(new Date(),1))),
    sb.from('components').select('*').order('name'),
    sb.from('maintenances').select('*').order('next_due'),
    sb.from('contacts').select('*').order('name'),
    sb.from('calendar_sources').select('*').order('name')
  ]);
  const bad=[m,e,c,ev,me,td].find(r=>r.error);
  if(bad) throw bad.error;
  // Il modulo Casa funziona solo dopo aver eseguito schema_casa.sql: se manca, il resto dell'app continua a funzionare.
  const casaMissing=[co,ma,ct].some(r=>r.error);
  state.d = { members:m.data, expenses:e.data, chores:c.data, events:ev.data, meals:me.data, dayMeals:td.data,
    components:casaMissing?[]:co.data, maintenances:casaMissing?[]:ma.data, contacts:casaMissing?[]:ct.data, casaMissing,
    calSources:cs.error?[]:cs.data, calMissing:!!cs.error };
}

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  state.user = session?.user || null;
  if(!state.user){ state.screen='auth'; return render(); }
  const { data:mem, error } = await sb.from('members').select('*').eq('user_id',state.user.id).maybeSingle();
  if(error){ state.err=error.message; state.screen='auth'; return render(); }
  if(!mem){ state.screen='onboard'; return render(); }
  state.member = mem;
  const { data:h } = await sb.from('households').select('*').eq('id',mem.household_id).maybeSingle();
  state.house = h;
  try { await loadData(); state.screen='main'; } catch(e){ state.err=e.message; state.screen='auth'; }
  render();
}
async function refresh(){ try{ await loadData(); }catch(e){ alert(e.message); } render(); }

// ---------- render ----------
function render(){
  const s=state.screen;
  if(s==='loading') app.innerHTML='<div class="center"><h1>Casa</h1><p>Caricamento…</p></div>';
  else if(s==='auth') app.innerHTML=viewAuth();
  else if(s==='onboard') app.innerHTML=viewOnboard();
  else app.innerHTML=viewMain();
}

function viewAuth(){ return `
<div class="center"><h1>🏠 Casa</h1><p>Accedi per vedere spese, faccende, menu e impegni.</p>
<form data-form="auth" class="stack">
  <label>Email<input name="email" type="email" required autocomplete="email"></label>
  <label>Password<input name="password" type="password" required minlength="6" autocomplete="current-password"></label>
  <div class="err">${esc(state.err)}</div>
  <div class="row" style="justify-content:stretch">
    <button class="primary" style="flex:1" data-act="login">Accedi</button>
    <button class="outline" style="flex:1" data-act="signup">Registrati</button>
  </div>
</form></div>`; }

function viewOnboard(){ return `
<div class="center"><h1>Benvenuto</h1><p>Crea la vostra casa, oppure unisciti con il codice invito del partner.</p>
<form data-form="create" class="stack card">
  <b>Crea una nuova casa</b>
  <label>Nome casa<input name="house" value="Casa" required></label>
  <label>Il tuo nome<input name="me" required></label>
  <button class="primary">Crea</button>
</form>
<form data-form="join" class="stack card">
  <b>Unisciti a una casa</b>
  <label>Codice invito<input name="code" required autocapitalize="off"></label>
  <label>Il tuo nome<input name="me" required></label>
  <button class="primary">Unisciti</button>
</form>
<div class="err">${esc(state.err)}</div>
<button class="link" data-act="logout">Esci</button></div>`; }

function viewMain(){
  const body = { oggi:tabOggi, spese:tabSpese, faccende:tabFaccende, menu:tabMenu, impegni:tabImpegni, casa:tabCasa }[state.tab]();
  const showFab = ['spese','faccende','impegni'].includes(state.tab) || (state.tab==='casa' && !state.d.casaMissing);
  return `
<header><div><h1>${esc(state.house?.name||'Casa')}</h1><small>Ciao ${esc(state.member.display_name)}</small></div>
<button class="link" data-act="settings" aria-label="Impostazioni">⚙️</button></header>
<main>${body}</main>
${showFab?`<button class="primary fab" data-act="add-${state.tab}" aria-label="Aggiungi">+</button>`:''}
<nav>${TABS.map(([k,i,l])=>`<button class="${state.tab===k?'on':''}" data-tab="${k}"><span>${i}</span>${l}</button>`).join('')}</nav>`;
}

// ----- Oggi: resoconto della giornata -----
const pl = (n,s,p) => `${n} ${n===1?s:p}`;
const hm = s => new Date(s).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
// Impegni: quelli importati dai calendari (source_id) sono in sola lettura; quelli tutto il giorno vanno per primi.
const byTime = (a,b) => (b.all_day-a.all_day) || a.starts_at.localeCompare(b.starts_at);
const srcName = id => state.d.calSources.find(s=>s.id===id)?.name;
const evWho = e => e.source_id ? '📅 '+esc(srcName(e.source_id)||'calendario') : esc(nameOf(e.assignee));
const evAct = e => `data-act="${e.source_id?'cal-info':'edit-event'}" data-id="${e.id}"`;
function rowEventShort(e){
  return `<div class="card item"><div class="grow" ${evAct(e)}><div class="t">${e.all_day?'':`<span class="when">${hm(e.starts_at)}</span>`}${esc(e.title)}</div>
  <div class="s">${e.all_day?'tutto il giorno · ':''}${evWho(e)}${e.notes?' · '+esc(e.notes):''}</div></div></div>`;
}
function tabOggi(){
  const d=state.d, t=today(), tomorrow=iso(addDays(new Date(),1)), in7=iso(addDays(new Date(),7));
  const me=state.member.user_id, hour=new Date().getHours();
  const greet=hour<13?'Buongiorno':hour<18?'Buon pomeriggio':'Buonasera';
  const dateStr=new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
  const dayOf=s=>iso(new Date(s));
  const evToday=d.events.filter(e=>dayOf(e.starts_at)===t).sort(byTime);
  const evTom=d.events.filter(e=>dayOf(e.starts_at)===tomorrow).sort(byTime);
  const chores=d.chores.filter(c=>c.next_due<=t).sort((a,b)=>(b.assignee===me)-(a.assignee===me));
  const mine=chores.filter(c=>c.assignee===me).length;
  const exp=d.expenses.filter(e=>!e.paid_at && e.due_date<=in7);
  const late=exp.filter(e=>e.due_date<t).length;
  const maint=d.maintenances.filter(x=>daysFromToday(x.next_due)<=30);
  const maintSoon=maint.filter(x=>daysFromToday(x.next_due)<=7).length;
  const warr=d.components.filter(c=>c.warranty_until && daysFromToday(c.warranty_until)>=0 && daysFromToday(c.warranty_until)<=60);
  const meal=(day,slot)=>d.dayMeals.find(m=>m.day===day&&m.slot===slot)?.dish;
  const lunch=meal(t,'pranzo'), dinner=meal(t,'cena'), tLunch=meal(tomorrow,'pranzo'), tDinner=meal(tomorrow,'cena');

  const parts=[];
  if(evToday.length) parts.push(pl(evToday.length,'impegno','impegni'));
  if(chores.length) parts.push(pl(chores.length,'faccenda','faccende')+(mine?` (${mine} ${mine===1?'tua':'tue'})`:''));
  if(exp.length) parts.push(pl(exp.length,'scadenza','scadenze')+(late?` (${late} già ${late===1?'scaduta':'scadute'})`:''));
  if(maintSoon) parts.push(pl(maintSoon,'manutenzione','manutenzioni'));
  const sentence=parts.length?`In programma: ${parts.join(', ')}.`:'Niente in programma: giornata libera 🎉';
  const tavola=(lunch||dinner)?[lunch?`pranzo ${esc(lunch)}`:'',dinner?`cena ${esc(dinner)}`:''].filter(Boolean).join(' · '):'menu di oggi non ancora impostato';
  const slot=(s,v)=>`<div class="slot" data-act="meal" data-day="${t}" data-slot="${s}"><b>${s}</b>${v?`<span>${esc(v)}</span>`:'<span class="ph">tocca per aggiungere</span>'}</div>`;

  return `
<div class="card brief"><p class="hi">${greet}, ${esc(state.member.display_name)}</p><div class="dt">${dateStr}</div>
<div class="sum">${sentence}</div><div class="sum" style="margin-top:6px">🍽️ A tavola: ${tavola}</div></div>

<h2>🍽️ A tavola</h2>
<div class="card day">${slot('pranzo',lunch).replace('class="slot"','class="slot" style="border-top:0"')}${slot('cena',dinner)}</div>
${(tLunch||tDinner)?`<p class="hint">Domani: ${[tLunch?'pranzo '+esc(tLunch):'',tDinner?'cena '+esc(tDinner):''].filter(Boolean).join(' · ')}</p>`:''}

<h2>📅 Impegni di oggi</h2>
${evToday.length?evToday.map(rowEventShort).join(''):'<div class="empty">Nessun impegno oggi</div>'}
${evTom.length?`<div class="sub">Domani</div>${evTom.map(rowEventShort).join('')}`:''}

<h2>✅ Da fare oggi</h2>
${chores.length?chores.map(rowChore).join(''):'<div class="empty">Nessuna faccenda in sospeso ✨</div>'}

<h2>💶 Scadenze (prossimi 7 giorni)</h2>
${exp.length?exp.map(rowExpense).join(''):'<div class="empty">Niente in scadenza 🎉</div>'}
${maint.length?`<h2>🔧 Manutenzioni in arrivo</h2>${maint.map(rowMaint).join('')}`:''}
${warr.length?`<h2>🛡️ Garanzie in scadenza</h2>${warr.map(rowWarranty).join('')}`:''}
<p class="hint">Aggiornato alle ${hm(new Date())}</p>`;
}

// ----- Spese -----
function rowExpense(e){
  return `<div class="card item"><div class="grow" data-act="edit-expense" data-id="${e.id}"><div class="t">${esc(e.title)}</div>
  <div class="s">${dueLabel(e.due_date)} · ${esc(e.category)}${e.amount!=null?' · '+eur(e.amount):''}${e.recurrence!=='none'?' · 🔁':''}</div></div>
  <button class="primary small" data-act="pay" data-id="${e.id}">Pagata</button></div>`;
}
function tabSpese(){
  const open=state.d.expenses.filter(e=>!e.paid_at);
  const paid=state.d.expenses.filter(e=>e.paid_at).sort((a,b)=>b.paid_at.localeCompare(a.paid_at));
  const mo=today().slice(0,7);
  const monthTotal=paid.filter(e=>e.paid_at.slice(0,7)===mo).reduce((s,e)=>s+Number(e.amount||0),0);
  const openTotal=open.reduce((s,e)=>s+Number(e.amount||0),0);
  return `
<div class="card item"><div><div class="s">Pagato questo mese</div><div class="t">${eur(monthTotal)}</div></div>
<div style="text-align:right"><div class="s">Ancora da pagare</div><div class="t">${eur(openTotal)}</div></div></div>
<h2>Da pagare</h2>
${open.length?open.map(rowExpense).join(''):'<div class="empty">Nessuna scadenza aperta</div>'}
<h2>Pagate di recente</h2>
${paid.slice(0,10).map(e=>`<div class="card item"><div class="grow" data-act="edit-expense" data-id="${e.id}"><div class="t">${esc(e.title)}</div>
<div class="s">${new Date(e.paid_at).toLocaleDateString('it-IT')} · ${esc(e.category)}${e.amount!=null?' · '+eur(e.amount):''}</div></div></div>`).join('')||'<div class="empty">Ancora niente</div>'}
<p class="hint">Tocca una voce per modificarla o eliminarla.</p>`;
}

// ----- Faccende -----
function rowChore(c){
  return `<div class="card item"><div class="grow" data-act="edit-chore" data-id="${c.id}"><div class="t">${esc(c.title)}</div>
  <div class="s">${dueLabel(c.next_due)} · ogni ${c.every_days} g · ${esc(nameOf(c.assignee))}${c.assignee===state.member.user_id?'<span class="chip me">tua</span>':''}${c.rotate?' 🔄':''}</div></div>
  <button class="primary small" data-act="done-chore" data-id="${c.id}">Fatto</button></div>`;
}
function tabFaccende(){
  const list=state.d.chores;
  return `<h2>Tutte le faccende</h2>
${list.length?list.map(rowChore).join(''):'<div class="empty">Aggiungi la prima faccenda con +</div>'}
${list.length?'<p class="hint">Tocca una faccenda per modificarla o eliminarla.</p>':''}`;
}

// ----- Menu -----
function tabMenu(){
  const ws=state.weekStart, t=today();

// ----- Impegni -----
function rowEvent(e){
  return `<div class="card item"><div class="grow" ${evAct(e)}><div class="t">${esc(e.title)}</div>
  <div class="s">${e.all_day?'tutto il giorno':hm(e.starts_at)} · ${evWho(e)}${e.notes?' · '+esc(e.notes):''}</div></div></div>`;
}
function tabImpegni(){
  const d=state.d, t=today();
  const dayOf=s=>iso(new Date(s));
  const list=d.events.filter(e=>dayOf(e.starts_at)>=t).sort((a,b)=>dayOf(a.starts_at).localeCompare(dayOf(b.starts_at))||byTime(a,b));
  const days=[...new Set(list.map(e=>dayOf(e.starts_at)))];
  const last=d.calSources.map(s=>s.last_synced_at).filter(Boolean).sort().pop();
  const bad=d.calSources.filter(s=>s.last_error).length;
  let bar;
  if(d.calMissing) bar=`<div class="card"><b>Calendari non ancora attivi</b><p class="s">Esegui <code>schema_calendari.sql</code> nell'SQL Editor di Supabase per collegare i calendari.</p></div>`;
  else if(!d.calSources.length) bar=`<div class="card"><b>Collega i tuoi calendari</b><p class="s">Da ⚙️ → Calendari aggiungi il link del calendario Apple o Google: gli impegni arriveranno qui da soli.</p></div>`;
  else bar=`<div class="card item"><div class="s">📅 ${pl(d.calSources.length,'calendario collegato','calendari collegati')}<br>${bad?`<span class="late">⚠️ ${pl(bad,'con errori','con errori')} (vedi ⚙️)</span>`:(last?'aggiornato '+fmtDT(last):'mai sincronizzato')}</div>
  <button class="outline small" data-act="sync">🔄 Sincronizza</button></div>`;
  return bar+(days.length
    ? days.map(day=>`<h2>${fmtDay(day)}${day===t?' · oggi':''}</h2>${list.filter(e=>dayOf(e.starts_at)===day).map(rowEvent).join('')}`).join('')+'<p class="hint">Gli impegni 📅 arrivano dai calendari: si modificano da lì. Gli altri si modificano toccandoli.</p>'
    : '<h2>Prossimi impegni</h2><div class="empty">Nessun impegno in programma</div>');
}

const safeUrl = u => /^https?:\/\//i.test(u||'') ? u : '';
const fmtDate = s => new Date(s+'T00:00').toLocaleDateString('it-IT');
function warrantyChip(c){
  if(!c.warranty_until) return '';
  const n=daysFromToday(c.warranty_until);
  if(n<0) return `<span class="late">garanzia scaduta</span>`;
  return `<span class="${n<=60?'soon':''}">garanzia fino al ${fmtDate(c.warranty_until)}</span>`;
}
function rowComponent(c){
  const bm=[c.brand,c.model].filter(Boolean).map(esc).join(' ');
  const man=safeUrl(c.manual_url);
  return `<div class="card item"><div class="grow" data-act="edit-component" data-id="${c.id}"><div class="t">${esc(c.name)}</div>
  <div class="s">${[bm,esc(c.category),warrantyChip(c)].filter(Boolean).join(' · ')}</div></div>
  ${man?`<a class="btn ghost" href="${esc(man)}" target="_blank" rel="noopener" aria-label="Manuale">📖</a>`:''}</div>`;
}
function rowWarranty(c){
  return `<div class="card item"><div class="grow" data-act="edit-component" data-id="${c.id}"><div class="t">${esc(c.name)}</div>
  <div class="s">${warrantyChip(c)}${c.room?' · '+esc(c.room):''}</div></div></div>`;
}
function rowMaint(x){
  const comp=state.d.components.find(c=>c.id===x.component_id);
  return `<div class="card item"><div class="grow" data-act="edit-maint" data-id="${x.id}"><div class="t">${esc(x.title)}</div>
  <div class="s">${dueLabel(x.next_due)}${comp?' · '+esc(comp.name):''} · ogni ${x.every_months} ${x.every_months===1?'mese':'mesi'}</div></div>
  <button class="primary small" data-act="done-maint" data-id="${x.id}">Fatto</button></div>`;

function rowContact(c){
  const tel=String(c.phone||'').replace(/[^\d+]/g,'');
  return `<div class="card item"><div class="grow" data-act="edit-contact" data-id="${c.id}"><div class="t">${esc(c.name)}</div>
  <div class="s">${[c.role,c.phone,c.notes].filter(Boolean).map(esc).join(' · ')}</div></div>
  ${tel?`<a class="btn primary" href="tel:${tel}">Chiama</a>`:''}</div>`;

function tabCasa(){
  const d=state.d, v=state.casaView;
  const seg=`<div class="seg">${[['componenti','Componenti'],['manutenzioni','Manutenzioni'],['contatti','Contatti']].map(([k,l])=>`<button class="${v===k?'on':''}" data-act="casa-view" data-v="${k}">${l}</button>`).join('')}</div>`;
  if(d.casaMissing) return seg+`<div class="card"><b>Modulo non ancora attivo</b><p class="s">Esegui il file <code>schema_casa.sql</code> nell'SQL Editor di Supabase, poi ricarica l'app.</p></div>`;
  let body='';
  if(v==='componenti'){
    const rooms=[...new Set(d.components.map(c=>c.room||'Senza stanza'))].sort((a,b)=>a.localeCompare(b,'it'));
    body=d.components.length
      ? rooms.map(r=>`<h2>${esc(r)}</h2>`+d.components.filter(c=>(c.room||'Senza stanza')===r).map(rowComponent).join('')).join('')+'<p class="hint">Tocca un componente per modificarlo o eliminarlo. 📖 apre il manuale.</p>'
      : '<div class="empty">Aggiungi caldaia, lavatrice, forno… con il +, con garanzia e link al manuale.</div>';
  } else if(v==='manutenzioni'){
    body=d.maintenances.length
      ? '<h2>Prossime scadenze</h2>'+d.maintenances.map(rowMaint).join('')+'<p class="hint">"Fatto" imposta la prossima scadenza in automatico.</p>'
      : '<div class="empty">Aggiungi controlli ricorrenti (caldaia, filtri, ecc.) con il +.</div>';
  } else {
    body=d.contacts.length
      ? '<h2>Contatti utili</h2>'+d.contacts.map(rowContact).join('')
      : '<div class="empty">Aggiungi idraulico, elettricista, amministratore… con il +.</div>';
  }
  return seg+body;
}

// ---------- form modale ----------
// onDelete (opzionale): mostra il pulsante Elimina
function openForm(title, fields, onSave, onDelete){
  const el=document.createElement('div'); el.className='modal';
  el.innerHTML=`<form class="sheet"><h3>${esc(title)}</h3>${fields.map(f=>`<label>${esc(f.label)}${
    f.type==='select'
      ? `<select name="${f.name}">${f.options.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(f.value)?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`
      : `<input name="${f.name}" type="${f.type||'text'}" value="${esc(f.value??'')}" ${f.step?`step="${f.step}"`:''} ${f.req?'required':''}>`
  }</label>`).join('')}<div class="row">${onDelete?'<button type="button" class="danger" data-del>Elimina</button><span class="spacer"></span>':''}<button type="button" class="ghost" data-x>Annulla</button><button class="primary">Salva</button></div></form>`;
  document.body.appendChild(el);
  el.querySelector('[data-x]').onclick=()=>el.remove();
  el.onclick=e=>{ if(e.target===el) el.remove(); };
  if(onDelete) el.querySelector('[data-del]').onclick=async()=>{
    if(!confirm('Eliminare definitivamente?')) return;
    try{ await onDelete(); el.remove(); await refresh(); }catch(err){ alert(err.message||err); }
  };
  el.querySelector('form').onsubmit=async e=>{
    e.preventDefault();
    try{ await onSave(Object.fromEntries(new FormData(e.target))); el.remove(); await refresh(); }
    catch(err){ alert(err.message||err); }
  };
}

// Chiede alla funzione di Supabase di rileggere i calendari collegati
async function syncNow(){
  const { data, error } = await sb.functions.invoke('sync-calendars',{ body:{} });
  if(error){
    let msg=error.message||String(error);
    try{ const j=await error.context.json(); msg=j.error||j.message||msg; }catch(_){}
    if(/not found|404/i.test(msg)) msg='Funzione di sincronizzazione non trovata: va installata su Supabase (vedi le istruzioni).';
    throw new Error(msg);
  }
  await loadData(); render();
  const bad=(data?.results||[]).filter(r=>!r.ok);
  if(bad.length) alert('Problema con: '+bad.map(r=>`${r.name} (${r.error})`).join('; '));
}

function openSettings(){
  const d=state.d, el=document.createElement('div'); el.className='modal';
  const cal = d.calMissing
    ? `<p class="s">Per collegare i calendari esegui <code>schema_calendari.sql</code> in Supabase.</p>`
    : (d.calSources.length ? d.calSources.map(s=>`<div class="kv"><span>${esc(s.name)}<br><small>${s.last_error?'⚠️ '+esc(s.last_error):(s.last_synced_at?'aggiornato '+esc(fmtDT(s.last_synced_at)):'non ancora sincronizzato')}</small></span><span><button class="link" data-del-src="${s.id}" aria-label="Rimuovi">🗑</button></span></div>`).join('') : '<p class="s">Nessun calendario collegato.</p>')
      +`<div class="row"><button class="outline small" data-add-src>➕ Aggiungi calendario</button>${d.calSources.length?'<button class="ghost small" data-sync>🔄 Sincronizza ora</button>':''}</div>`;
  el.innerHTML=`<div class="sheet"><h3>⚙️ ${esc(state.house?.name||'Casa')}</h3>
  <div class="kv"><span>Account</span><span>${esc(state.member.display_name)}<br><small>${esc(state.user?.email||'')}</small></span></div>
  <div class="kv"><span>Codice invito</span><span><b>${esc(state.house?.invite_code||'')}</b></span></div>
  <div class="kv"><span>Membri</span><span>${d.members.map(m=>esc(m.display_name)).join(', ')}</span></div>
  <h2 style="margin-top:18px">📅 Calendari collegati</h2>${cal}
  <div class="row" style="margin-top:14px"><button class="ghost" data-x>Chiudi</button><button class="danger" data-logout>Esci dall'account</button></div></div>`;
  document.body.appendChild(el);
  el.querySelector('[data-x]').onclick=()=>el.remove();
  el.onclick=e=>{ if(e.target===el) el.remove(); };
  el.querySelector('[data-logout]').onclick=async()=>{ el.remove(); await actions.logout(); };
  const add=el.querySelector('[data-add-src]');
  if(add) add.onclick=()=>{
    el.remove();
    openForm('Aggiungi calendario',[
      {name:'name',label:'Nome (es. Famiglia Apple, Google)',req:true},
      {name:'url',label:'Link del calendario (webcal:// o https://…)',req:true}
    ], async v => {
      const url=v.url.trim();
      if(!/^(https?|webcals?):\/\//i.test(url)) throw new Error('Il link deve iniziare con webcal:// oppure https://');
      must(await sb.from('calendar_sources').insert({name:v.name.trim(),url}));
      try{ await syncNow(); }catch(e){ alert('Calendario aggiunto, ma la sincronizzazione non è riuscita: '+(e.message||e)); }
    });
  };
  const sync=el.querySelector('[data-sync]');
  if(sync) sync.onclick=async()=>{
    sync.disabled=true; sync.textContent='⏳ Sincronizzo…';
    try{ await syncNow(); el.remove(); openSettings(); }catch(e){ alert(e.message||e); sync.disabled=false; sync.textContent='🔄 Sincronizza ora'; }
  };
  el.querySelectorAll('[data-del-src]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Scollegare questo calendario? Verranno rimossi dall\'app anche i suoi impegni (il calendario originale non viene toccato).')) return;
    try{ must(await sb.from('calendar_sources').delete().eq('id',b.dataset.delSrc)); el.remove(); await refresh(); openSettings(); }catch(e){ alert(e.message||e); }
  });
}

  },
  'done-maint': async el => {
    const x=findBy('maintenances',el); if(!x) return;
    must(await sb.from('maintenances').update({last_done:today(), next_due:addMonths(today(),x.every_months)}).eq('id',x.id));
    await refresh();
  },
  'edit-contact': el => {
    const c=findBy('contacts',el); if(!c) return;
    openForm('Modifica contatto',contactFields(c),
      async v => must(await sb.from('contacts').update(contactRow(v)).eq('id',c.id)),
      async () => must(await sb.from('contacts').delete().eq('id',c.id)));
  },

  // Menu
  'week': async el => { state.weekStart=addDays(state.weekStart,7*Number(el.dataset.n)); await refresh(); },
  'meal': el => {
    const {day,slot}=el.dataset;
    const cur=[...state.d.meals,...state.d.dayMeals].find(m=>m.day===day&&m.slot===slot)?.dish||'';
    openForm(`${slot[0].toUpperCase()+slot.slice(1)} · ${fmtDay(day)}`,[{name:'dish',label:'Piatto (vuoto per cancellare)',value:cur}],
      async v => {
        const dish=v.dish.trim();
        if(!dish) must(await sb.from('meals').delete().eq('day',day).eq('slot',slot));
        else must(await sb.from('meals').upsert({household_id:state.member.household_id,day,slot,dish},{onConflict:'household_id,day,slot'}));
      });
  },

  // Account
  'settings': () => openSettings(),
  'logout': async () => {
    try{ await sb.auth.signOut(); }catch(e){}
    state.err=''; state.member=null; state.user=null; state.house=null; state.tab='oggi'; state.screen='auth'; render();
  }
};

// ---------- eventi ----------
app.addEventListener('click', async e => {
  const tab=e.target.closest('[data-tab]');
  if(tab){ state.tab=tab.dataset.tab; render(); window.scrollTo(0,0); return; }
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act;
  if(act==='login'||act==='signup') return; // gestiti dal submit
  const fn=actions[act]; if(fn){ try{ await fn(el); }catch(err){ alert(err.message||err); } }
});

app.addEventListener('submit', async e => {
  const f=e.target.closest('[data-form]'); if(!f) return;
  e.preventDefault();
  const v=Object.fromEntries(new FormData(f)); state.err='';
  try{
    if(f.dataset.form==='auth'){
      const signup = e.submitter?.dataset.act==='signup';
      const r = signup ? await sb.auth.signUp({email:v.email,password:v.password}) : await sb.auth.signInWithPassword({email:v.email,password:v.password});
      if(r.error) throw r.error;
      if(signup && !r.data.session){ state.err='Controlla la mail per confermare l\'account, poi accedi.'; return render(); }
    } else if(f.dataset.form==='create'){
      must(await sb.rpc('create_household',{h_name:v.house,my_name:v.me}));
    } else if(f.dataset.form==='join'){
      must(await sb.rpc('join_household',{code:v.code,my_name:v.me}));
    }
    await boot();
  }catch(err){ state.err=err.message||String(err); render(); }
});

sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT'){ state.screen='auth'; render(); } });

// Quando riapri l'app (o torni sulla scheda) il resoconto si aggiorna con i dati più recenti
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && state.screen==='main') refresh(); });

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script>
</body>
</html>
