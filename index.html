<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Casa</title>
<style>
:root{
  --bg:#f5f6f4; --card:#fff; --ink:#1d2421; --muted:#6b7772; --line:#e3e7e4;
  --brand:#1f6f5c; --brand-ink:#fff; --warn:#c2410c; --danger:#b91c1c; --ok:#15803d;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121614; --card:#1b211f; --ink:#e8eeeb; --muted:#8c9a94; --line:#2a3330; --brand:#3aa78d; --brand-ink:#08120f; --warn:#fb923c; --danger:#f87171; --ok:#4ade80;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) 16px 10px}
header h1{font-size:20px;margin:0}
header small{color:var(--muted)}
main{flex:1;padding:4px 16px 96px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.item{display:flex;align-items:center;gap:10px;justify-content:space-between}
.item .t{font-weight:600}
.item .s{color:var(--muted);font-size:14px}
.late{color:var(--danger)} .soon{color:var(--warn)} .ok{color:var(--ok)}
.empty{color:var(--muted);padding:6px 2px;font-size:14px}
button{font:inherit;border:0;border-radius:10px;padding:9px 14px;cursor:pointer}
.primary{background:var(--brand);color:var(--brand-ink);font-weight:600}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.small{padding:6px 10px;font-size:14px}
.link{background:none;color:var(--muted);padding:4px 6px}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 76px);width:54px;height:54px;border-radius:50%;font-size:28px;line-height:1;padding:0;box-shadow:0 4px 14px rgba(0,0,0,.25)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--muted);padding:10px 2px 8px;font-size:12px;border-radius:0}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--brand);font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px)}
.sheet h3{margin:0 0 10px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
input,select{display:block;width:100%;margin-top:4px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.center{padding:48px 20px}
.center h1{margin:0 0 6px}
.center p{color:var(--muted)}
.stack>*{margin-bottom:10px}
.weekbar{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.day{margin-bottom:8px}
.day .dn{font-weight:600;margin-bottom:4px}
.day .dn.today{color:var(--brand)}
.slot{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.slot b{width:56px;font-size:12px;text-transform:uppercase;color:var(--muted);font-weight:600}
.slot span.ph{color:var(--muted)}
.err{color:var(--danger);font-size:14px;min-height:20px}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ============ CONFIGURAZIONE ============
// Supabase → Project Settings → API
const SUPABASE_URL = 'https://dbdxilaxtspzxuyrxbra.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Bevfj67zK_NfGfJBb5GyNg_sjsMwn6k';
// ========================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');

const CATS = ['bollette','condominio','mutuo/affitto','assicurazioni','tasse','spesa','manutenzione','altro'];
const RECS = [['none','Una tantum'],['monthly','Ogni mese'],['bimonthly','Ogni 2 mesi'],['quarterly','Ogni 3 mesi'],['semiannual','Ogni 6 mesi'],['yearly','Ogni anno']];
const REC_N = {none:0, monthly:1, bimonthly:2, quarterly:3, semiannual:6, yearly:12};
const TABS = [['oggi','🏠','Oggi'],['spese','💶','Spese'],['faccende','🧹','Faccende'],['menu','🍝','Menu'],['impegni','📅','Impegni']];

const state = { screen:'loading', user:null, member:null, house:null, tab:'oggi', d:{}, weekStart:monday(new Date()), err:'' };

// ---------- utilità ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function monday(d){ d=new Date(d); d.setDate(d.getDate()-((d.getDay()+6)%7)); d.setHours(0,0,0,0); return d; }
function iso(d){ const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function addMonths(s,n){
  const [y,m,d]=s.split('-').map(Number);
  const t=new Date(y,m-1+n,1), last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  t.setDate(Math.min(d,last)); return iso(t);
}
const today = () => iso(new Date());
const eur = n => n==null ? '' : new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n);
const fmtDay = s => new Date(s+'T00:00').toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'});
const fmtDT = s => new Date(s).toLocaleString('it-IT',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const nameOf = id => (state.d.members||[]).find(m=>m.user_id===id)?.display_name || '—';
function daysFromToday(s){ return Math.round((new Date(s+'T00:00') - new Date(today()+'T00:00'))/86400000); }
function dueLabel(s){
  const n=daysFromToday(s);
  if(n<0) return `<span class="late">scaduta da ${-n} g</span>`;
  if(n===0) return `<span class="soon">oggi</span>`;
  if(n===1) return `<span class="soon">domani</span>`;
  return `<span class="${n<=7?'soon':''}">${fmtDay(s)}</span>`;
}

// ---------- dati ----------
async function loadData(){
  const ws=iso(state.weekStart), we=iso(addDays(state.weekStart,6));
  const [m,e,c,ev,me,td] = await Promise.all([
    sb.from('members').select('*'),
    sb.from('expenses').select('*').order('due_date'),
    sb.from('chores').select('*').order('next_due'),
    sb.from('events').select('*').gte('starts_at', new Date(Date.now()-864e5).toISOString()).order('starts_at'),
    sb.from('meals').select('*').gte('day',ws).lte('day',we),
    sb.from('meals').select('*').eq('day',today())
  ]);
  const bad=[m,e,c,ev,me,td].find(r=>r.error);
  if(bad) throw bad.error;
  state.d = { members:m.data, expenses:e.data, chores:c.data, events:ev.data, meals:me.data, todayMeals:td.data };
}

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  state.user = session?.user || null;
  if(!state.user){ state.screen='auth'; return render(); }
  const { data:mem, error } = await sb.from('members').select('*').eq('user_id',state.user.id).maybeSingle();
  if(error){ state.err=error.message; state.screen='auth'; return render(); }
  if(!mem){ state.screen='onboard'; return render(); }
  state.member = mem;
  const { data:h } = await sb.from('households').select('*').eq('id',mem.household_id).maybeSingle();
  state.house = h;
  try { await loadData(); state.screen='main'; } catch(e){ state.err=e.message; state.screen='auth'; }
  render();
}
async function refresh(){ try{ await loadData(); }catch(e){ alert(e.message); } render(); }

// ---------- render ----------
function render(){
  const s=state.screen;
  if(s==='loading') app.innerHTML='<div class="center"><h1>Casa</h1><p>Caricamento…</p></div>';
  else if(s==='auth') app.innerHTML=viewAuth();
  else if(s==='onboard') app.innerHTML=viewOnboard();
  else app.innerHTML=viewMain();
}

function viewAuth(){ return `
<div class="center"><h1>🏠 Casa</h1><p>Accedi per vedere spese, faccende, menu e impegni.</p>
<form data-form="auth" class="stack">
  <label>Email<input name="email" type="email" required autocomplete="email"></label>
  <label>Password<input name="password" type="password" required minlength="6" autocomplete="current-password"></label>
  <div class="err">${esc(state.err)}</div>
  <div class="row" style="justify-content:stretch">
    <button class="primary" style="flex:1" data-act="login">Accedi</button>
     <button class="ghost" style="flex:1" data-act="signup">Registrati</button>
  </div>
</form></div>`; }

function viewOnboard(){ return `
<div class="center"><h1>Benvenuto</h1><p>Crea la vostra casa, oppure unisciti con il codice invito del partner.</p>
<form data-form="create" class="stack card">
  <b>Crea una nuova casa</b>
  <label>Nome casa<input name="house" value="Casa" required></label>
  <label>Il tuo nome<input name="me" required></label>
  <button class="primary">Crea</button>
</form>
<form data-form="join" class="stack card">
  <b>Unisciti a una casa</b>
  <label>Codice invito<input name="code" required autocapitalize="off"></label>
  <label>Il tuo nome<input name="me" required></label>
  <button class="primary">Unisciti</button>
</form>
<div class="err">${esc(state.err)}</div>
<button class="link" data-act="logout">Esci</button></div>`; }

function viewMain(){
  const body = { oggi:tabOggi, spese:tabSpese, faccende:tabFaccende, menu:tabMenu, impegni:tabImpegni }[state.tab]();
  const showFab = ['spese','faccende','impegni'].includes(state.tab);
  return `
<header><div><h1>${esc(state.house?.name||'Casa')}</h1><small>Ciao ${esc(state.member.display_name)}</small></div>
<button class="link" data-act="settings">⚙️</button></header>
<main>${body}</main>
${showFab?`<button class="primary fab" data-act="add-${state.tab}">+</button>`:''}
<nav>${TABS.map(([k,i,l])=>`<button class="${state.tab===k?'on':''}" data-tab="${k}"><span>${i}</span>${l}</button>`).join('')}</nav>`;
}

// ----- Oggi -----
function tabOggi(){
  const d=state.d, t=today(), in7=iso(addDays(new Date(),7));
  const exp=d.expenses.filter(e=>!e.paid_at && e.due_date<=in7);
  const ch=d.chores.filter(c=>c.next_due<=t);
  const tom=iso(addDays(new Date(),2));
  const ev=d.events.filter(e=>iso(new Date(e.starts_at))<tom && iso(new Date(e.starts_at))>=t);
  const lunch=d.todayMeals.find(m=>m.slot==='pranzo')?.dish, dinner=d.todayMeals.find(m=>m.slot==='cena')?.dish;
  return `
<h2>Menu di oggi</h2>
<div class="card"><div>🍽️ Pranzo: ${lunch?esc(lunch):'<span class="empty">non impostato</span>'}</div>
<div>🌙 Cena: ${dinner?esc(dinner):'<span class="empty">non impostata</span>'}</div></div>
<h2>Scadenze nei prossimi 7 giorni</h2>
${exp.length?exp.map(rowExpense).join(''):'<div class="empty">Niente in scadenza 🎉</div>'}
<h2>Faccende da fare</h2>
${ch.length?ch.map(rowChore).join(''):'<div class="empty">Tutto fatto ✨</div>'}
<h2>Impegni oggi e domani</h2>
${ev.length?ev.map(rowEvent).join(''):'<div class="empty">Nessun impegno</div>'}`;
}

// ----- Spese -----
function rowExpense(e){
  return `<div class="card item"><div><div class="t">${esc(e.title)}</div>
  <div class="s">${dueLabel(e.due_date)} · ${esc(e.category)}${e.amount!=null?' · '+eur(e.amount):''}${e.recurrence!=='none'?' · 🔁':''}</div></div>
  <button class="primary small" data-act="pay" data-id="${e.id}">Pagata</button></div>`;
}
function tabSpese(){
  const open=state.d.expenses.filter(e=>!e.paid_at);
  const paid=state.d.expenses.filter(e=>e.paid_at).sort((a,b)=>b.paid_at.localeCompare(a.paid_at));
  const mo=today().slice(0,7);
  const monthTotal=paid.filter(e=>e.paid_at.slice(0,7)===mo).reduce((s,e)=>s+Number(e.amount||0),0);
  const openTotal=open.reduce((s,e)=>s+Number(e.amount||0),0);
  return `
<div class="card item"><div><div class="s">Pagato questo mese</div><div class="t">${eur(monthTotal)}</div></div>
<div style="text-align:right"><div class="s">Ancora da pagare</div><div class="t">${eur(openTotal)}</div></div></div>
<h2>Da pagare</h2>
${open.length?open.map(rowExpense).join(''):'<div class="empty">Nessuna scadenza aperta</div>'}
<h2>Pagate di recente</h2>
${paid.slice(0,10).map(e=>`<div class="card item"><div><div class="t">${esc(e.title)}</div>
<div class="s">${new Date(e.paid_at).toLocaleDateString('it-IT')} · ${esc(e.category)}${e.amount!=null?' · '+eur(e.amount):''}</div></div>
<button class="link" data-act="del-expense" data-id="${e.id}">🗑</button></div>`).join('')||'<div class="empty">Ancora niente</div>'}
${open.length?`<h2>Gestisci</h2>${open.map(e=>`<div class="card item"><span>${esc(e.title)}</span><button class="link" data-act="del-expense" data-id="${e.id}">🗑 Elimina</button></div>`).join('')}`:''}`;
}

// ----- Faccende -----
function rowChore(c){
  return `<div class="card item"><div><div class="t">${esc(c.title)}</div>
  <div class="s">${dueLabel(c.next_due)} · ogni ${c.every_days} g · ${esc(nameOf(c.assignee))}${c.rotate?' 🔄':''}</div></div>
  <button class="primary small" data-act="done-chore" data-id="${c.id}">Fatto</button></div>`;
}
function tabFaccende(){
  const list=state.d.chores;
  return `<h2>Tutte le faccende</h2>
${list.length?list.map(c=>`${rowChore(c)}`).join(''):'<div class="empty">Aggiungi la prima faccenda con +</div>'}
${list.length?`<h2>Gestisci</h2>${list.map(c=>`<div class="card item"><span>${esc(c.title)}</span><button class="link" data-act="del-chore" data-id="${c.id}">🗑 Elimina</button></div>`).join('')}`:''}`;
}

// ----- Menu -----
function tabMenu(){
  const ws=state.weekStart, t=today();
  const days=[...Array(7)].map((_,i)=>iso(addDays(ws,i)));
  const label=`${fmtDay(days[0])} – ${fmtDay(days[6])}`;
  return `
<div class="weekbar"><button class="ghost small" data-act="week" data-n="-1">‹</button><b>${label}</b><button class="ghost small" data-act="week" data-n="1">›</button></div>
${days.map(day=>{
  const g=s=>state.d.meals.find(m=>m.day===day&&m.slot===s)?.dish;
  return `<div class="card day"><div class="dn ${day===t?'today':''}">${fmtDay(day)}</div>
  ${['pranzo','cena'].map(s=>`<div class="slot" data-act="meal" data-day="${day}" data-slot="${s}"><b>${s}</b>${g(s)?`<span>${esc(g(s))}</span>`:'<span class="ph">tocca per aggiungere</span>'}</div>`).join('')}</div>`;
}).join('')}`;
}

// ----- Impegni -----
function rowEvent(e){
  return `<div class="card item"><div><div class="t">${esc(e.title)}</div>
  <div class="s">${fmtDT(e.starts_at)} · ${esc(nameOf(e.assignee))}${e.notes?' · '+esc(e.notes):''}</div></div>
  <button class="link" data-act="del-event" data-id="${e.id}">🗑</button></div>`;
}
function tabImpegni(){
  const list=state.d.events;
  return `<h2>Prossimi impegni</h2>${list.length?list.map(rowEvent).join(''):'<div class="empty">Nessun impegno in programma</div>'}`;
}

// ---------- form modale ----------
function openForm(title, fields, onSave){
  const el=document.createElement('div'); el.className='modal';
  el.innerHTML=`<form class="sheet"><h3>${esc(title)}</h3>${fields.map(f=>`<label>${esc(f.label)}${
    f.type==='select'
      ? `<select name="${f.name}">${f.options.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(f.value)?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`
      : `<input name="${f.name}" type="${f.type||'text'}" value="${esc(f.value??'')}" ${f.step?`step="${f.step}"`:''} ${f.req?'required':''}>`
  }</label>`).join('')}<div class="row"><button type="button" class="ghost" data-x>Annulla</button><button class="primary">Salva</button></div></form>`;
  document.body.appendChild(el);
  el.querySelector('[data-x]').onclick=()=>el.remove();
  el.onclick=e=>{ if(e.target===el) el.remove(); };
  el.querySelector('form').onsubmit=async e=>{
    e.preventDefault();
    try{ await onSave(Object.fromEntries(new FormData(e.target))); el.remove(); await refresh(); }
    catch(err){ alert(err.message||err); }
  };
}
const memberOpts = () => state.d.members.map(m=>[m.user_id,m.display_name]);
const must = r => { if(r.error) throw r.error; return r; };

// ---------- azioni ----------
const actions = {
  'add-spese': () => openForm('Nuova spesa / scadenza',[
    {name:'title',label:'Descrizione',req:true},
    {name:'category',label:'Categoria',type:'select',options:CATS.map(c=>[c,c])},
    {name:'amount',label:'Importo (€)',type:'number',step:'0.01'},
    {name:'due_date',label:'Scadenza',type:'date',value:today(),req:true},
    {name:'recurrence',label:'Ricorrenza',type:'select',options:RECS}
  ], async v => must(await sb.from('expenses').insert({
    title:v.title, category:v.category, amount:v.amount===''?null:Number(v.amount), due_date:v.due_date, recurrence:v.recurrence
  }))),

  'pay': async el => {
    const x=state.d.expenses.find(e=>e.id===el.dataset.id); if(!x) return;
    must(await sb.from('expenses').update({paid_at:new Date().toISOString()}).eq('id',x.id));
    const n=REC_N[x.recurrence];
    if(n) must(await sb.from('expenses').insert({title:x.title,category:x.category,amount:x.amount,due_date:addMonths(x.due_date,n),recurrence:x.recurrence}));
    await refresh();
  },
  'del-expense': async el => { if(confirm('Eliminare?')){ must(await sb.from('expenses').delete().eq('id',el.dataset.id)); await refresh(); } },

  'add-faccende': () => openForm('Nuova faccenda',[
    {name:'title',label:'Faccenda',req:true},
    {name:'every_days',label:'Ogni quanti giorni',type:'number',value:7,req:true},
    {name:'assignee',label:'Assegnata a',type:'select',options:memberOpts(),value:state.member.user_id},
    {name:'rotate',label:'A rotazione tra voi',type:'select',options:[['false','No'],['true','Sì']]},
    {name:'next_due',label:'Prima scadenza',type:'date',value:today()}
  ], async v => must(await sb.from('chores').insert({
    title:v.title, every_days:Number(v.every_days), assignee:v.assignee, rotate:v.rotate==='true', next_due:v.next_due||today()
  }))),

  'done-chore': async el => {
    const c=state.d.chores.find(x=>x.id===el.dataset.id); if(!c) return;
    let assignee=c.assignee;
    if(c.rotate && state.d.members.length>1){
      const ids=state.d.members.map(m=>m.user_id), i=ids.indexOf(c.assignee);
      assignee=ids[(i+1)%ids.length];
    }
    must(await sb.from('chores').update({last_done:today(), next_due:iso(addDays(new Date(),c.every_days)), assignee}).eq('id',c.id));
    await refresh();
  },
  'del-chore': async el => { if(confirm('Eliminare?')){ must(await sb.from('chores').delete().eq('id',el.dataset.id)); await refresh(); } },

  'add-impegni': () => openForm('Nuovo impegno',[
    {name:'title',label:'Cosa',req:true},
    {name:'starts_at',label:'Quando',type:'datetime-local',req:true},
    {name:'assignee',label:'Per chi',type:'select',options:memberOpts(),value:state.member.user_id},
    {name:'notes',label:'Note'}
  ], async v => must(await sb.from('events').insert({
    title:v.title, starts_at:new Date(v.starts_at).toISOString(), assignee:v.assignee, notes:v.notes||null
  }))),
  'del-event': async el => { if(confirm('Eliminare?')){ must(await sb.from('events').delete().eq('id',el.dataset.id)); await refresh(); } },

  'week': async el => { state.weekStart=addDays(state.weekStart,7*Number(el.dataset.n)); await refresh(); },
  'meal': el => {
    const {day,slot}=el.dataset;
    const cur=state.d.meals.find(m=>m.day===day&&m.slot===slot)?.dish||'';
    openForm(`${slot[0].toUpperCase()+slot.slice(1)} · ${fmtDay(day)}`,[{name:'dish',label:'Piatto (vuoto per cancellare)',value:cur}],
      async v => {
        const dish=v.dish.trim();
        if(!dish) must(await sb.from('meals').delete().eq('day',day).eq('slot',slot));
        else must(await sb.from('meals').upsert({household_id:state.member.household_id,day,slot,dish},{onConflict:'household_id,day,slot'}));
      });
  },

  'settings': () => alert(`Casa: ${state.house?.name}\nCodice invito per Sara: ${state.house?.invite_code}\n\nMembri: ${state.d.members.map(m=>m.display_name).join(', ')}`),
  'logout': async () => { await sb.auth.signOut(); state.err=''; state.member=null; state.screen='auth'; render(); }
};

// ---------- eventi ----------
app.addEventListener('click', async e => {
  const tab=e.target.closest('[data-tab]');
  if(tab){ state.tab=tab.dataset.tab; render(); window.scrollTo(0,0); return; }
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act;
  if(act==='login'||act==='signup') return; // gestiti dal submit
  const fn=actions[act]; if(fn){ try{ await fn(el); }catch(err){ alert(err.message||err); } }
});

app.addEventListener('submit', async e => {
  const f=e.target.closest('[data-form]'); if(!f) return;
  e.preventDefault();
  const v=Object.fromEntries(new FormData(f)); state.err='';
  try{
    if(f.dataset.form==='auth'){
      const signup = e.submitter?.dataset.act==='signup';
      const r = signup ? await sb.auth.signUp({email:v.email,password:v.password}) : await sb.auth.signInWithPassword({email:v.email,password:v.password});
      if(r.error) throw r.error;
      if(signup && !r.data.session){ state.err='Controlla la mail per confermare l\'account, poi accedi.'; return render(); }
    } else if(f.dataset.form==='create'){
      must(await sb.rpc('create_household',{h_name:v.house,my_name:v.me}));
    } else if(f.dataset.form==='join'){
      must(await sb.rpc('join_household',{code:v.code,my_name:v.me}));
    }
    await boot();
  }catch(err){ state.err=err.message||String(err); render(); }
});

sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT'){ state.screen='auth'; render(); } });

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script>
</body>
</html>
